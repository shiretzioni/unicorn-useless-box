<!doctype html>
<title>קופסת החד-קרן המיותרת</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap">
<style>
  :root{
    --sky-top:#241a4d;
    --sky-mid:#4a2f7a;
    --sky-bot:#c96fa3;
    --cloud:#fdeef5;
    --wood:#f6e3c4;
    --wood-dark:#e0bf8f;
    --plum:#3b2a4a;
    --cream:#fff8ef;
    --navy-slot:#1c1440;
    --pink:#ff6b81;
    --marigold:#ffc154;
    --butter:#fde74c;
    --mint:#7bd389;
    --sky-blue:#5bc8f2;
    --lavender:#a78bfa;
    --gold:#f2c94c;
    --walnut:#7a5236;
    --walnut-dark:#5e3f28;
    --focus:#fff3b0;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;}

  body{
    min-height:100vh;
    background:
      radial-gradient(1.2px 1.2px at 8% 15%, #fff 100%, transparent),
      radial-gradient(1.5px 1.5px at 22% 8%, #fff 100%, transparent),
      radial-gradient(1px 1px at 35% 20%, #fff 100%, transparent),
      radial-gradient(1.3px 1.3px at 48% 6%, #fff 100%, transparent),
      radial-gradient(1px 1px at 63% 14%, #fff 100%, transparent),
      radial-gradient(1.6px 1.6px at 78% 9%, #fff 100%, transparent),
      radial-gradient(1px 1px at 90% 18%, #fff 100%, transparent),
      radial-gradient(1.2px 1.2px at 12% 30%, #fff 100%, transparent),
      radial-gradient(1px 1px at 85% 32%, #fff 100%, transparent),
      linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 45%, var(--sky-bot) 100%);
    background-attachment:fixed;
    font-family:'Varela Round','Arial Hebrew',sans-serif;
    color:var(--cream);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 16px 40px;
    overflow-x:hidden;
    direction:rtl;
  }

  .stars{
    position:fixed; inset:0; pointer-events:none; z-index:0;
    animation:twinkle 4s ease-in-out infinite;
    opacity:.8;
  }
  @media (prefers-reduced-motion: reduce){ .stars{animation:none;} }
  @keyframes twinkle{ 0%,100%{opacity:.55;} 50%{opacity:1;} }

  .scene{ position:relative; z-index:1; width:100%; max-width:820px; display:flex; flex-direction:column; align-items:center; }

  h1{
    font-size:clamp(26px,4.4vw,40px);
    margin:6px 0 2px;
    text-align:center;
    text-wrap:balance;
    color:var(--cream);
    text-shadow:0 2px 0 rgba(0,0,0,.25);
    letter-spacing:.5px;
  }
  .subtitle{
    margin:0 0 22px;
    font-size:clamp(13px,2vw,15px);
    color:#e9d9f5;
    text-align:center;
    max-width:520px;
    opacity:.9;
  }

  .rainbow-arch{
    width:min(560px,92vw);
    height:170px;
    margin-bottom:-64px;
    z-index:0;
  }

  .rig{ position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; }

  .unicorn{ width:96px; margin-bottom:-26px; margin-inline-end:-150px; z-index:5; filter:drop-shadow(0 6px 8px rgba(0,0,0,.35)); }

  .box{
    position:relative;
    background:linear-gradient(180deg,var(--wood) 0%, var(--wood-dark) 100%);
    border-radius:22px;
    padding:22px 20px 26px;
    box-shadow:0 18px 0 -4px rgba(0,0,0,.18), 0 20px 34px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.5);
    border:4px solid var(--walnut-dark);
  }
  .stripe-top{
    position:absolute; top:-9px; left:18px; right:18px; height:9px; border-radius:6px;
    background:repeating-linear-gradient(90deg,
      var(--pink) 0 8%, var(--marigold) 8% 16%, var(--butter) 16% 24%, var(--mint) 24% 32%,
      var(--sky-blue) 32% 40%, var(--lavender) 40% 48%, var(--pink) 48% 56%, var(--marigold) 56% 64%,
      var(--butter) 64% 72%, var(--mint) 72% 80%, var(--sky-blue) 80% 88%, var(--lavender) 88% 100%);
  }

  .panels{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }

  .panel{ position:relative; width:118px; display:flex; flex-direction:column; align-items:center; }

  .door-frame{
    position:relative;
    width:100%; height:86px;
    perspective:420px;
    border-radius:10px 10px 4px 4px;
    background:var(--navy-slot);
    box-shadow:inset 0 0 0 3px var(--walnut-dark);
    overflow:hidden;
  }
  .door-frame::before{
    content:'';
    position:absolute; inset:0;
    background:
      radial-gradient(1px 1px at 20% 30%, #fff 100%, transparent),
      radial-gradient(1px 1px at 70% 20%, #fff 100%, transparent),
      radial-gradient(1px 1px at 45% 60%, #fff 100%, transparent),
      radial-gradient(1px 1px at 85% 70%, #fff 100%, transparent),
      radial-gradient(1px 1px at 30% 80%, #fff 100%, transparent);
    opacity:.7;
  }

  .door-half{
    position:absolute; top:0; bottom:0; width:50%;
    background:linear-gradient(160deg,var(--cream),var(--wood-dark));
    border:2px solid var(--walnut-dark);
    transition:transform .55s cubic-bezier(.34,1.56,.64,1);
    display:flex; align-items:center; justify-content:center;
  }
  .door-half.left{ left:0; transform-origin:left center; border-radius:8px 0 2px 6px; }
  .door-half.right{ right:0; transform-origin:right center; border-radius:0 8px 6px 2px; }
  .door-half svg{ width:26px; height:26px; opacity:.85; }

  .panel.open .door-half.left{ transform:rotateY(-100deg); }
  .panel.open .door-half.right{ transform:rotateY(100deg); }

  .interior{ position:relative; width:100%; height:52px; overflow:hidden; }

  /* Travels relative to the whole panel (not clipped by .door-frame) so it can
     reach all the way down from the doorway to the switch knob below. */
  .hand{
    position:absolute; left:50%; top:0;
    width:34px; height:60px;
    transform:translate(-50%,-70px);
    opacity:0;
    transition:transform .4s ease-in, opacity .3s ease-in;
    z-index:5;
    pointer-events:none;
  }
  .panel.hand-out .hand{ transform:translate(-50%,40px); opacity:1; transition:transform .45s cubic-bezier(.3,1.4,.5,1), opacity .15s ease-out; }
  .panel.hand-push .hand{ transform:translate(-50%,85px); opacity:1; transition:transform .18s ease-out; }

  .switch-housing{
    position:relative;
    width:64px; height:78px;
    background:linear-gradient(180deg,var(--walnut),var(--walnut-dark));
    border-radius:8px;
    border:2px solid var(--walnut-dark);
    margin-top:2px;
    box-shadow:inset 0 2px 4px rgba(0,0,0,.4), 0 3px 0 rgba(0,0,0,.25);
  }
  .lever-track{
    position:absolute; left:50%; top:8px; bottom:8px; width:8px; margin-inline-start:-4px;
    background:var(--navy-slot); border-radius:6px;
    box-shadow:inset 0 0 4px rgba(0,0,0,.6);
  }
  .lever{
    position:absolute; left:50%; top:8px;
    width:30px; height:30px; margin-inline-start:-15px;
    border-radius:50%;
    background:radial-gradient(circle at 32% 28%, #fff, var(--pink) 55%, #d1466a 100%);
    border:2px solid #b5335a;
    box-shadow:0 3px 5px rgba(0,0,0,.4);
    transition:transform .3s cubic-bezier(.4,0,.2,1);
    cursor:pointer;
    transform:translateY(40px);
  }
  .lever:focus-visible{ outline:3px solid var(--focus); outline-offset:2px; }
  .panel.lever-open .lever{ transform:translateY(0); }

  .switch-label{
    margin-top:6px; font-size:10.5px; letter-spacing:.4px; color:#e9d9f5; opacity:.85;
  }

  .sparkle{
    position:absolute; pointer-events:none; z-index:6;
    font-size:14px; opacity:0; will-change:transform,opacity;
    animation:sparkle-pop .8s ease-out forwards;
  }
  @keyframes sparkle-pop{
    0%{opacity:0; transform:translate(0,0) scale(.4) rotate(0deg);}
    15%{opacity:1;}
    100%{opacity:0; transform:translate(var(--dx,10px),var(--dy,-38px)) scale(1.1) rotate(60deg);}
  }
  @media (prefers-reduced-motion: reduce){
    .door-half, .hand, .lever{ transition-duration:.05s; }
    .sparkle{ display:none; }
  }

  .plaque{
    margin-top:26px;
    background:var(--cream);
    color:var(--plum);
    border-radius:14px;
    padding:12px 22px;
    text-align:center;
    box-shadow:0 8px 18px rgba(0,0,0,.3);
    border:3px solid var(--gold);
    max-width:420px;
  }
  .plaque .count{ font-size:28px; font-variant-numeric:tabular-nums; color:var(--pink); }
  .plaque .msg{ font-size:13px; min-height:18px; margin-top:2px; }

  .cloud-stand{
    width:min(640px,94vw); height:70px; margin-top:-14px; z-index:0;
    filter:drop-shadow(0 10px 10px rgba(0,0,0,.25));
  }

  .sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }
</style>

<svg class="stars" aria-hidden="true"></svg>

<div class="scene">
  <h1>קופסת החד־קרן המיותרת</h1>
  <p class="subtitle">ארבעה מתגים, ארבע דלתות, ואפס תועלת. תרימו מתג ל"פתוח" — ותראו מי דואג לסגור אותו בחזרה.</p>

  <svg class="rainbow-arch" viewBox="0 0 400 170" aria-hidden="true">
    <g fill="none" stroke-width="16" stroke-linecap="round">
      <path d="M20,170 A180,180 0 0 1 380,170" stroke="#a78bfa"/>
      <path d="M36,170 A164,164 0 0 1 364,170" stroke="#5bc8f2"/>
      <path d="M52,170 A148,148 0 0 1 348,170" stroke="#7bd389"/>
      <path d="M68,170 A132,132 0 0 1 332,170" stroke="#fde74c"/>
      <path d="M84,170 A116,116 0 0 1 316,170" stroke="#ffc154"/>
      <path d="M100,170 A100,100 0 0 1 300,170" stroke="#ff6b81"/>
    </g>
  </svg>

  <div class="rig">
    <svg class="unicorn" viewBox="0 0 120 110" aria-hidden="true">
      <ellipse cx="55" cy="88" rx="34" ry="16" fill="#efe6ff" opacity=".5"/>
      <path d="M20,70 Q10,40 30,28 Q26,18 34,10 Q38,20 42,22 Q60,14 76,28 Q90,38 84,58 Q92,64 90,74 Q80,68 74,72 Q60,86 40,82 Q26,80 20,70 Z" fill="#fffaf3" stroke="#e3d5c0" stroke-width="1.5"/>
      <path d="M32,26 L26,6 L38,20 Z" fill="#f2c94c" stroke="#c99a1e" stroke-width="1"/>
      <circle cx="66" cy="40" r="3" fill="#3b2a4a"/>
      <path d="M40,20 Q46,4 62,10 Q56,16 58,24 Q66,14 78,22 Q70,26 70,34 Q60,22 46,28 Q50,20 40,20 Z" fill="#ff6b81" opacity=".9"/>
      <path d="M42,22 Q48,8 60,14 Q54,18 56,26 Q64,18 74,24" fill="none" stroke="#a78bfa" stroke-width="4" stroke-linecap="round" opacity=".85"/>
      <path d="M16,66 Q2,58 6,44 Q12,54 20,58" fill="#5bc8f2" opacity=".85"/>
      <path d="M14,72 Q0,68 2,54" fill="#7bd389" opacity=".85"/>
    </svg>

    <div class="box">
      <div class="stripe-top"></div>
      <div class="panels" id="panels">
        <!-- panel template x4 injected by JS -->
      </div>
    </div>
  </div>

  <svg class="cloud-stand" viewBox="0 0 400 70" aria-hidden="true">
    <ellipse cx="70" cy="40" rx="60" ry="26" fill="#fdeef5"/>
    <ellipse cx="160" cy="30" rx="80" ry="32" fill="#fff8ef"/>
    <ellipse cx="260" cy="42" rx="70" ry="26" fill="#fdeef5"/>
    <ellipse cx="340" cy="34" rx="55" ry="24" fill="#fff8ef"/>
  </svg>

  <div class="plaque">
    <div class="count" id="count">0</div>
    <div class="msg" id="msg">ניסיונות חד־קרן מיותרים עד כה</div>
  </div>
</div>

<div id="live" class="sr-only" aria-live="polite"></div>

<script>
(function(){
  var panelsEl = document.getElementById('panels');
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var count = 0;
  var countEl = document.getElementById('count');
  var msgEl = document.getElementById('msg');
  var liveEl = document.getElementById('live');

  var doorIcons = [
    '<circle cx="13" cy="13" r="6" fill="#a78bfa"/>',
    '<path d="M13 4 L18 22 L13 18 L8 22 Z" fill="#ffc154"/>',
    '<circle cx="13" cy="13" r="6" fill="#7bd389"/>',
    '<path d="M13 4 L18 22 L13 18 L8 22 Z" fill="#5bc8f2"/>'
  ];

  var milestones = {
    1: 'ניסיון מיותר ראשון! כל הכבוד 🎉',
    3: 'שלוש פעמים? המתג לא מתכוון להישאר פתוח',
    5: 'חמש! החד־קרן מתחילה לחשוד שזה בכוונה',
    10: 'עשר?! באמת אין לך כלום אחר לעשות',
    20: 'עשרים ניסיונות מיותרים. מרשים ומבאס בו־זמנית',
    35: 'שלושים וחמש. החד־קרן שוקלת חופשה',
    50: 'חמישים! זו כבר קריירה'
  };
  var stillGoing = [
    'עדיין כאן?',
    'המתג עדיין יחזור למקום, מובטח',
    'זה ממש לא הולך לעבוד בפעם הבאה',
    'החד־קרן מריחה נחישות',
    'קשת בענן אחת, מתג אחד, אפס תוצאות'
  ];

  function updateCounter(){
    count++;
    countEl.textContent = count;
    var text;
    if (milestones[count]) text = milestones[count];
    else if (count > 50 && count % 10 === 0) text = stillGoing[Math.floor(Math.random()*stillGoing.length)];
    if (text){ msgEl.textContent = text; }
  }

  function sleep(ms){ return new Promise(function(res){ setTimeout(res, reduced ? Math.min(ms,60) : ms); }); }

  function burstSparkles(container, n){
    if (reduced) return;
    for (var i=0;i<n;i++){
      var s = document.createElement('span');
      s.className = 'sparkle';
      s.textContent = ['✨','⭐','🌟'][i % 3];
      var x = 20 + Math.random()*70;
      var y = 10 + Math.random()*40;
      s.style.left = x + '%';
      s.style.top = y + '%';
      s.style.setProperty('--dx', (Math.random()*30-15)+'px');
      s.style.setProperty('--dy', (-30-Math.random()*20)+'px');
      container.appendChild(s);
      (function(el){ setTimeout(function(){ el.remove(); }, 850); })(s);
    }
  }

  function buildPanel(i){
    var panel = document.createElement('div');
    panel.className = 'panel';
    panel.innerHTML =
      '<div class="door-frame">' +
        '<div class="door-half left"><svg viewBox="0 0 26 26">'+doorIcons[i]+'</svg></div>' +
        '<div class="door-half right"><svg viewBox="0 0 26 26">'+doorIcons[i]+'</svg></div>' +
        '<div class="interior"></div>' +
      '</div>' +
      '<div class="hand">' +
        '<svg viewBox="0 0 34 60" width="34" height="60">' +
          '<rect x="9" y="0" width="16" height="34" rx="8" fill="#fff8ef" stroke="#e3d5c0" stroke-width="1.5"/>' +
          '<rect x="6" y="26" width="22" height="12" rx="6" fill="#a78bfa"/>' +
          '<path d="M11,34 L11,46 Q11,54 17,54 Q23,54 23,46 L23,34" fill="#3b2a4a"/>' +
          '<path d="M13,54 L13,60 M17,54 L17,60 M21,54 L21,60" stroke="#3b2a4a" stroke-width="3" stroke-linecap="round"/>' +
        '</svg>' +
      '</div>' +
      '<div class="switch-housing">' +
        '<div class="lever-track"></div>' +
        '<div class="lever" role="button" tabindex="0" aria-pressed="false" aria-label="מתג ' + (i+1) + ', סגור"></div>' +
      '</div>' +
      '<div class="switch-label">מתג ' + (i+1) + '</div>';
    return panel;
  }

  for (var i=0;i<4;i++){ panelsEl.appendChild(buildPanel(i)); }

  var panelEls = Array.prototype.slice.call(panelsEl.children);

  panelEls.forEach(function(panel, idx){
    var lever = panel.querySelector('.lever');
    var interior = panel.querySelector('.interior');
    var frame = panel.querySelector('.door-frame');
    var busy = false;

    function activate(){
      if (busy) return;
      busy = true;
      lever.setAttribute('aria-pressed','true');
      lever.setAttribute('aria-label','מתג ' + (idx+1) + ', פתוח');
      updateCounter();
      liveEl.textContent = 'מתג ' + (idx+1) + ' נפתח';
      run();
    }

    async function run(){
      panel.classList.add('open');
      panel.classList.add('lever-open');
      burstSparkles(frame, 3);
      await sleep(550);
      panel.classList.add('hand-out');
      await sleep(480);
      panel.classList.add('hand-push');
      panel.classList.remove('lever-open');
      burstSparkles(interior, 2);
      await sleep(200);
      lever.setAttribute('aria-pressed','false');
      lever.setAttribute('aria-label','מתג ' + (idx+1) + ', סגור');
      liveEl.textContent = 'היד סגרה את מתג ' + (idx+1);
      await sleep(260);
      panel.classList.remove('hand-push');
      panel.classList.remove('hand-out');
      await sleep(420);
      panel.classList.remove('open');
      await sleep(550);
      busy = false;
    }

    lever.addEventListener('click', activate);
    lever.addEventListener('keydown', function(e){
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); activate(); }
    });
  });
})();
</script>
